<dialog id="editor-dialog" class="manage-dialog editor-dialog" aria-labelledby="editor-title"><div class="editor-shell"><header><p>NÉT / HỒ SƠ TÁC PHẨM</p><h2 id="editor-title">Thêm tác phẩm mới</h2></header><form id="artwork-form"><div class="editor-layout"><div class="editor-upload"><img id="editor-image" src="/assets/favicon.svg" alt="Ảnh đại diện đang chờ chọn"><label class="upload-button">Chọn ảnh đại diện<input id="artwork-image-file" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="image-filename">JPG, PNG hoặc WebP · tối đa 8 MB</p><div class="video-upload"><label class="upload-button">Chọn video giới thiệu<input id="artwork-video-file" name="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"></label><p id="video-filename">Video tùy chọn · MP4, WebM hoặc MOV · tối đa 1 GiB</p><video id="editor-video" controls playsinline preload="metadata" aria-label="Xem trước video giới thiệu" hidden></video><button id="remove-video" type="button" class="text-link" hidden>Gỡ video khỏi tác phẩm ×</button></div></div><div class="editor-fields"><label class="full-width">Tên tác phẩm *<input name="title" required maxlength="200" placeholder="Ví dụ: Sen trong nắng"></label><label>Tác giả<input name="author" maxlength="200" placeholder="Chưa xác định"></label><label>Nhóm nghệ thuật *<select name="category" required><option value="painting">Hội họa</option><option value="sculpture">Điêu khắc</option><option value="graphic">Đồ họa</option><option value="blue">Gốm men lam</option><option value="brown">Gốm men nâu</option><option value="white">Gốm men trắng</option><option value="other">Nghệ thuật khác</option></select></label><label>Niên đại hiển thị *<input name="period" required maxlength="100" placeholder="Ví dụ: Thế kỷ XX"></label><label>Năm bắt đầu *<input name="year" type="number" required min="-5000" max="2100" step="1" placeholder="Ví dụ: 1900"><small>Dùng để lọc và sắp xếp niên đại.</small></label><label>Chất liệu *<input name="material" required maxlength="300" placeholder="Ví dụ: Sơn dầu trên toan"></label><label>Xuất xứ<input name="origin" maxlength="150" placeholder="Việt Nam"></label><label>Chủ đề<input name="topic" maxlength="100" placeholder="Gốm Việt"></label><label>Từ khóa (ngăn bằng dấu phẩy)<input name="tags"></label><label>Tên gốc<input name="originalTitle" maxlength="300"></label><label>Nguồn (URL)<input name="source" type="url" maxlength="1500"></label><label class="full-width">Bản quyền<input name="license" maxlength="500"></label><label class="full-width">Mô tả *<textarea name="description" required maxlength="5000" rows="4" placeholder="Câu chuyện và đặc điểm của tác phẩm…"></textarea></label></div></div><section class="attachment-fields"><h3>Tư liệu đính kèm</h3><p>Thêm nhiều ảnh chi tiết, audio tiếng Việt, PDF, DOCX hoặc TXT.</p><input id="attachment-files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.mp3,.wav,.pdf,.docx,.txt,.mp4,.webm"><div id="attachment-items" class="attachment-items"></div><p id="editor-progress" class="upload-progress" role="status"></p><button type="button" id="editor-cancel-upload" class="text-link" hidden>Dừng tải (có thể tiếp tục)</button></section><p id="editor-error" class="form-error" role="alert"></p><div class="editor-footer"><button type="button" class="button button-outline" data-editor-close>Hủy</button><button id="editor-submit" type="submit" class="button button-dark">Thêm vào bộ sưu tập ↗</button></div></form></div><button class="dialog-close icon-button" data-editor-close aria-label="Đóng biểu mẫu">×</button></dialog>
