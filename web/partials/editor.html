<dialog id="editor-dialog" class="manage-dialog editor-dialog" aria-labelledby="editor-title"><div class="editor-shell"><header><p>NÉT / HỒ SƠ TÁC PHẨM</p><h2 id="editor-title">Thêm tác phẩm mới</h2></header><form id="artwork-form"><div class="editor-layout"><div class="editor-upload"><img id="editor-image" src="/assets/favicon.svg" alt="Ảnh đại diện đang chờ chọn"><label class="upload-button">Chọn ảnh đại diện<input id="artwork-image-file" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><p id="image-filename">JPG, PNG hoặc WebP · tối đa 8 MB</p></div><div class="editor-fields"><label class="full-width">Tên tác phẩm *<input name="title" required maxlength="200" placeholder="Ví dụ: Sen trong nắng"></label><label>Tác giả<input name="author" maxlength="200" placeholder="Chưa xác định"></label><label>Nhóm nghệ thuật *<select name="category" required><option value="painting">Hội họa</option><option value="sculpture">Điêu khắc</option><option value="graphic">Đồ họa</option><option value="blue">Gốm men lam</option><option value="brown">Gốm men nâu</option><option value="white">Gốm men trắng</option><option value="other">Nghệ thuật khác</option></select></label><label>Niên đại hiển thị *<input name="period" required maxlength="100" placeholder="Ví dụ: Thế kỷ XX"></label><label>Năm bắt đầu *<input name="year" type="number" required min="-5000" max="2100" step="1" placeholder="Ví dụ: 1900"><small>Dùng để lọc và sắp xếp niên đại.</small></label><label>Chất liệu *<input name="material" required maxlength="300" placeholder="Ví dụ: Sơn dầu trên toan"></label><label>Xuất xứ<input name="origin" maxlength="150" placeholder="Việt Nam"></label><label class="full-width">Mô tả *<textarea name="description" required maxlength="5000" rows="4" placeholder="Câu chuyện và đặc điểm của tác phẩm…"></textarea></label><label class="full-width">Từ khóa<input name="tags" placeholder="hoa sen, phong cảnh, sơn dầu"><small>Ngăn cách bằng dấu phẩy, tối đa 20 từ khóa.</small></label><label>Tên gốc (nếu có)<input name="originalTitle" maxlength="250"></label><label>Nguồn tư liệu<input name="source" type="url" maxlength="1500" placeholder="https://…"></label><label class="full-width">Ghi nguồn / quyền sử dụng ảnh<input name="license" maxlength="500" placeholder="Ví dụ: Ảnh do tác giả cung cấp"></label></div></div><p id="editor-error" class="form-error" role="alert"></p><div class="editor-footer"><button type="button" class="button button-outline" data-editor-close>Hủy</button><button id="editor-submit" type="submit" class="button button-dark">Thêm vào bộ sưu tập ↗</button></div></form></div><button class="dialog-close icon-button" data-editor-close aria-label="Đóng biểu mẫu">×</button></dialog>
